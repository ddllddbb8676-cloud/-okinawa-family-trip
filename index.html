    .section{padding:16px var(--content-pad) 0}.overview{padding:18px;border:1px solid #e1ebf0;border-radius:var(--radius-lg);box-shadow:var(--soft-shadow)}.flight{gap:12px}.flight-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;padding:4px 0}.flight-row span{width:auto;white-space:nowrap;padding:5px 7px;border-radius:8px;background:#e6f5f8;color:#087792;font-size:14px;font-weight:900;text-align:center}.flight-row strong{font-size:16px;line-height:1.65;letter-spacing:-.015em}.stay{margin-top:15px;padding:13px 14px;border:1px solid #cbe6ec;border-radius:12px;background:#eaf7fa;font-size:17px;line-height:1.55}.note{margin-top:13px;padding-top:13px;border-top:1px solid #e6edf1;line-height:1.65}
    .nav-shell{padding:9px 0;border-top:1px solid #e2ebf0;box-shadow:0 5px 16px rgba(18,60,105,.06)}.day-nav{gap:7px;padding:0 var(--content-pad)}.tab{min-width:76px;min-height:60px;padding:8px 12px;border-radius:14px}.tab[aria-selected="true"]{box-shadow:0 5px 13px rgba(18,60,105,.2)}
    .days{padding:12px var(--content-pad)}.day{border:1px solid #e2ebf0;border-radius:var(--radius-lg);box-shadow:var(--soft-shadow)}.day-head{align-items:center;padding:18px var(--content-pad);border-bottom:1px solid #e9f0f3}.date{font-size:24px;line-height:1.25}.area b{font-size:18px}.area small{display:inline-block;margin-top:3px;padding:3px 7px;border-radius:999px;background:#fff2de;color:#8a5711;font-size:13px;font-weight:800}.summary{padding:14px var(--content-pad) 16px;line-height:1.65}.badge{margin-bottom:5px;font-size:14px}.map-image-wrap{padding:0 var(--content-pad) 20px}.trip-map-static{margin:0 0 12px;border-radius:16px;box-shadow:none}.trip-map-static figcaption{font-size:15px}.map-image-wrap .map-actions{padding:2px 0 5px}.map-image-wrap .map-link{border-radius:12px;box-shadow:0 5px 12px rgba(18,60,105,.14)}.map-attribution{text-align:center;margin:9px 0 0}
    .timeline-title{margin-top:4px;padding:14px var(--content-pad) 6px;font-size:24px}.timeline-title+.map-disclaimer{padding:0 var(--content-pad) 14px}.timeline{padding:0 var(--content-pad) 10px}.timeline>li{padding-bottom:10px}.stop-fold{border-radius:var(--radius-md);box-shadow:0 3px 10px rgba(18,60,105,.045)}.stop-fold>summary{min-height:66px}.stop-fold.is-highlight{box-shadow:0 6px 16px rgba(18,103,112,.11)}.stop-content{border-top:0}.caution{margin:4px var(--content-pad) 18px}.day-switch{padding:4px var(--content-pad) 20px}.day-switch button{border-radius:12px}.check{margin:0 var(--content-pad) 28px;border:1px solid #e2ebf0;border-radius:var(--radius-lg);box-shadow:var(--soft-shadow)}
    .scene-grid,.guide-grid{padding-left:var(--content-pad);padding-right:var(--content-pad)}.scene-card,.guide-card,.intro-box{border-radius:16px}.intro-box{margin-left:var(--content-pad);margin-right:var(--content-pad)}.overview-map{margin-left:var(--content-pad);margin-right:var(--content-pad);padding:0;background:transparent}.trip-legend{padding-left:var(--content-pad);padding-right:var(--content-pad)}
    @media(max-width:520px){:root{--content-pad:8px}.hero{padding-left:18px;padding-right:18px}.hero p{font-size:17px;line-height:1.6}.facts{grid-template-columns:1fr 1fr}.fact{min-height:82px;padding:12px}.fact small{font-size:14px}.fact b{font-size:17px}.section{padding-top:12px}.overview{padding:15px 13px;border-radius:17px}.flight-row{grid-template-columns:58px minmax(0,1fr);gap:9px}.flight-row strong{font-size:15px;line-height:1.58}.stay{font-size:16px}.day-nav{padding-left:8px;padding-right:8px}.tab{min-width:72px}.days{padding-top:8px}.day{border-radius:13px}.day-head{padding:15px 10px}.date{font-size:22px}.area b{font-size:17px}.summary{padding:12px 10px 14px}.map-image-wrap{padding-left:3px;padding-right:3px}.trip-map-static{border-radius:10px}.timeline-title{padding-left:8px;padding-right:8px}.timeline-title+.map-disclaimer{padding-left:8px;padding-right:8px}.timeline{padding-left:3px;padding-right:3px}.check{margin-left:8px;margin-right:8px}.scene-grid,.guide-grid{padding-left:8px;padding-right:8px}.intro-box{margin-left:8px;margin-right:8px}.overview-map{margin-left:8px;margin-right:8px}.trip-legend{padding-left:8px;padding-right:8px}.route-explorer{grid-template-columns:minmax(0,1fr) 116px;gap:6px;margin-left:3px;margin-right:3px;padding:6px;border-radius:12px}.route-map-object{min-height:455px;border-radius:8px}.route-picker{gap:5px}.route-pick{min-height:50px;padding:6px 5px 6px 10px;border-radius:8px}.route-pick b{font-size:13px}.route-pick span{font-size:12px}.route-pick[aria-pressed="true"]{transform:translateX(-2px)}.route-selection{margin-left:3px;margin-right:3px;padding:12px}.route-selection strong{font-size:17px}.route-selection span{font-size:14px}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><div class="eyebrow" id="dates"></div><h1 id="title"></h1><p id="subtitle"></p><div class="facts" id="facts"></div></div></header>
  <main class="wrap">
    <section class="section"><div class="overview"><div class="flight" id="flight"></div><div class="stay" id="stay"></div><div class="note" id="flight-note"></div></div></section>
    <nav class="nav-shell" aria-label="날짜별 일정"><div class="day-nav" id="day-nav" role="tablist"></div></nav>
    <section class="days" id="days" aria-live="polite"></section>
    <section class="check"><h2>출발 전 확인</h2><div id="checklist"></div></section>
  </main>
  <footer class="footer"><span class="updated" id="updated"></span></footer>
  <script src="itinerary-data.js?v=maps-20260915"></script>
  <script>
    const d=window.TRIP_DATA;
    const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const mapUrl=x=>{const p=x.map.map(v=>v.query||v.name);const origin=p.shift(),destination=p.pop();return `https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&waypoints=${encodeURIComponent(p.join('|'))}`};

    // Place search links open Google Maps on phones without requiring an API key.
    const placeSearchUrl=query=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query);
    const visitQueries={"마키시 공설시장":"第一牧志公設市場 沖縄","국제거리 산책":"国際通り 沖縄","슈리성":"首里城 沖縄","쓰보야 도자기 거리":"壺屋やちむん通り 沖縄","오키나와 월드·교쿠센도":"おきなわワールド 玉泉洞","점심 · 이토만 수산시장":"糸満漁業協同組合 お魚センター","디엠엠 가리유시 수족관":"DMMかりゆし水族館","세나가섬 우미카지테라스":"瀬長島 ウミカジテラス","요미탄 도자기 마을":"やちむんの里 読谷村","점심 · 카페 갤러리 도카도카":"カフェギャラリー 土花土花 恩納村","만좌모":"万座毛 沖縄","고우리대교 남쪽 전망대":"古宇利大橋 南詰展望所 沖縄","고우리해변":"古宇利ビーチ","고우리 오션타워·점심":"古宇利オーシャンタワー","나고 파인애플 파크":"ナゴパイナップルパーク","츄라우미 수족관":"沖縄美ら海水族館","점심 · 카페 차하야부란":"カフェ チャハヤブラン 備瀬","비세 후쿠기 가로수길·해안":"備瀬のフクギ並木","잔파곶":"残波岬","아메리칸 빌리지":"美浜アメリカンビレッジ","이른 저녁 · 트랜짓 카페":"トランジットカフェ 北谷町"};
    const placeButton=(name,query)=>`<a class="place-map-link" href="${esc(placeSearchUrl(query))}" target="_blank" rel="noopener noreferrer" aria-label="${esc(name)} 구글 지도 열기">📍 ${esc(name)} · 구글 지도 ↗</a>`;
    const stopMapLinks=s=>{
      const places=[];
      if(s.activity)places.push([s.name,s.query||visitQueries[s.name]||s.name+' 沖縄']);
      const note=s.note||'';
      if(note.includes('포크타마고'))places.push(['포크타마고 오니기리 · 나하공항','ポーたま 那覇空港 国内線到着ロビー店']);
      if(note.includes('슈리소바'))places.push(['슈리소바','首里そば 那覇']);
      if(note.includes('우후야'))places.push(['백년고가 우후야','百年古家 大家 名護']);
      if(note.includes('오션블루'))places.push(['오션블루','オーシャンブルー 古宇利オーシャンタワー']);
      if(!s.activity && (s.name.includes('나하공항')||note.includes('나하공항')))places.push(['나하공항','那覇空港']);
      if(s.name==='아침 식사'&&note.includes('인천공항'))places.push(['인천공항 제2터미널','인천국제공항 제2여객터미널']);
      return places.length?`<div class="place-map-links">${places.map(([name,query])=>placeButton(name,query)).join('')}</div>`:'';
    };
    const routePlaceLink=(p,i)=>{
      const provisional=/호텔|집결지|렌터카|주유소/.test(p.name);
      return `<a class="key-item" href="${esc(placeSearchUrl(p.query||p.name+' 沖縄'))}" target="_blank" rel="noopener noreferrer" aria-label="${esc(p.name)} ${provisional?'주변 지도 · 위치 미정':'구글 지도 열기'}"><span class="key-num">${i+1}</span><span>${esc(p.name)}${provisional?' · 주변 지도':''} ↗</span></a>`;
    };

    const colors=['#6746bd','#ad7423','#de5264','#087baf','#b9337b','#23816b','#7445af','#466481'];
    const tripMapCard=(file,title)=>`<figure class="trip-map-static"><img src="maps/${file}.svg" alt="${esc(title)} · 전체 섬 위치와 당일 이동 경로" width="1600" height="1500" loading="lazy" decoding="async"><figcaption>방문 순서를 보기 위한 관광지도입니다.</figcaption></figure>`;
    const mapAttribution='<p class="map-attribution">지도 바탕: 일본 국토교통성 · <a href="https://www.geoboundaries.org/" target="_blank" rel="noopener">geoBoundaries</a> / <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · 한국어 표기·경로 편집</p>';
    const mapSvg=x=>`<div class="map-image-wrap">${tripMapCard('day-'+(d.days.indexOf(x)+1),(d.days.indexOf(x)+1)+'일차 · '+esc(x.area)+' 지도')}<div class="map-actions"><a class="map-link" href="${mapUrl(x)}" target="_blank" rel="noopener">실제 구글맵에서 경로 보기 ↗</a></div>${mapAttribution}</div>`;
    document.querySelector('#dates').textContent=d.dates;document.querySelector('#title').textContent=d.title;document.querySelector('#subtitle').textContent=d.subtitle;
    document.querySelector('#facts').innerHTML=[d.party,d.nights,...d.transport.map(x=>x.value)].map((v,i)=>`<div class="fact"><small>${['인원','기간','전일 이동','도심 이동'][i]}</small><b>${esc(v)}</b></div>`).join('');
    document.querySelector('#flight').innerHTML=`<div class="flight-row"><span>가는편</span><strong>${esc(d.flight.outbound)}</strong></div><div class="flight-row"><span>오는편</span><strong>${esc(d.flight.inbound)}</strong></div>`;document.querySelector('#stay').textContent='숙소 아직 미정 · 지역별 숙박 계획: '+d.stays;document.querySelector('#flight-note').textContent=d.flight.note;
    document.querySelector('#day-nav').innerHTML='<button class="tab" id="tab-main" role="tab" aria-selected="true" aria-controls="main-panel" data-day="-1">메인<span>전체 경로</span></button>'+d.days.map((x,i)=>`<button class="tab" id="tab-${i}" role="tab" aria-selected="${i===0}" aria-controls="day-${i}" data-day="${i}">${i+1}일차<span>${esc(x.date)} · ${esc(x.dow)}</span></button>`).join('');
    const travelInfo=s=>s.travel?`<div class="travel-info"><small>출발 · ${esc(s.travel.from)}</small><b>${esc(s.travel.mode)} · 약 ${s.travel.min}~${s.travel.max}분</b><span>${s.travel.tour?'투어 시간표 우선 · 집결 여유 30분 권장':`주차·대기 여유 30분 추가 → 총 ${s.travel.min+30}~${s.travel.max+30}분 확보 권장`}</span></div>`:'';

    const photoCard=p=>`<figure class="spot-photo"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(p.alt)} 사진 크게 보기"><img src="${esc(p.url)}" alt="${esc(p.alt)}" loading="lazy" decoding="async" onerror="this.closest('figure').hidden=true"></a><figcaption>${esc(p.alt)} · 사진을 누르면 크게 보여요<br><a href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">사진 출처 ↗</a></figcaption></figure>`;
    const spotDetails=s=>s.activity?`<div class="spot-card"><div class="spot-photos">${(s.photos?.length?s.photos:s.photo?[s.photo]:[]).slice(0,3).map(photoCard).join('')}</div><div class="spot-body"><h4>어떤 곳인가요?</h4><p class="spot-desc">${esc(s.activity)}</p><h4>여기서 할 일</h4><ol class="todo-list">${(s.todo||[s.note]).map(t=>`<li>${esc(t)}</li>`).join('')}</ol><p class="easy-tip">쉬엄쉬엄 팁 · ${esc(s.easyTip||'편한 속도로 둘러보고 중간에 쉬어요.')}</p><div class="status-row"><span class="status-book">🎟 ${esc(s.reservationLevel||'방문 전 확인')}</span><span class="status-park">🅿 ${esc(s.parkingStatus||'확인 필요')}</span></div><dl class="spot-info"><dt>예약·티켓</dt><dd>${esc(s.reservation||'불필요')}${s.bookingUrl?`<a class="info-link" href="${esc(s.bookingUrl)}" target="_blank" rel="noopener noreferrer">공식 안내·예매 확인 ↗</a>`:''}</dd><dt>비용</dt><dd>${esc(s.ticket||'별도 확인')}</dd><dt>8인승 주차</dt><dd>${esc(s.parking||'차량 크기와 주차장 조건 확인 필요')}${s.parkingSource?`<a class="info-link" href="${esc(s.parkingSource)}" target="_blank" rel="noopener noreferrer">주차 확인 자료 ↗</a>`:''}<a class="info-link" href="${esc(placeSearchUrl(s.parkingQuery||(s.query||visitQueries[s.name]||s.name+' 沖縄')+' 駐車場'))}" target="_blank" rel="noopener noreferrer">주변 주차장 지도 ↗</a></dd></dl>${s.source?`<a class="info-link" href="${esc(s.source)}" target="_blank" rel="noopener noreferrer">장소 안내 자료 ↗</a>`:''}</div></div>`:'';

    document.querySelector('#days').innerHTML=d.days.map((x,i)=>`<article class="day" id="day-${i}" role="tabpanel" aria-labelledby="tab-${i}" ${i?'hidden':''}><header class="day-head"><div class="date">${esc(x.date)} <small>${esc(x.dow)}요일</small></div><div class="area"><b>${esc(x.area)}</b><small>${esc(x.stay)} · 숙소 미정</small></div></header><p class="summary"><span class="badge"><span class="dot"></span>${esc(x.mode)}</span><br>${esc(x.summary)}</p>${mapSvg(x)}<h3 class="timeline-title">시간별 일정</h3><p class="map-disclaimer">색이 있는 ★ 주요 관광지는 사진과 설명이 준비되어 있어요. 시간과 장소를 누르면 예약·주차 정보까지 펼쳐집니다.</p><ol class="timeline">${x.stops.map(s=>`<li class="${s.kind==='meal'?'meal':''}"><details class="stop-fold${s.activity?' is-highlight':''}${s.kind==='meal'?' is-meal':''}"><summary><span class="stop-time">${esc(s.time)}</span><span class="stop-name" title="${esc(s.name)}">${esc(s.name)}</span><span class="stop-toggle" aria-hidden="true"></span></summary><div class="stop-content"><p class="stop-note">${esc(s.note)}</p>${stopMapLinks(s)}${travelInfo(s)}${spotDetails(s)}</div></details></li>`).join('')}</ol>${x.caution?`<p class="caution">${esc(x.caution)}</p>`:''}<div class="day-switch"><button data-move="${i-1}" ${i===0?'disabled':''}>← 전날</button><button data-move="${i+1}" >${i===d.days.length-1?'먹거리·기념품 →':'다음 날 →'}</button></div></article>`).join('');

    const tripScenes=[
      {title:'바다를 바라보는 시간',caption:'고우리의 푸른 바다 · 해안 산책 · 전망 카페',photo:d.days[4].stops.find(s=>s.name==='고우리대교 남쪽 전망대').photos[0],day:4},
      {title:'동네에서 맛보는 한 입',caption:'시장 골목 저녁 · 오우섬 튀김 · 지역 간식',photo:d.days[2].stops.find(s=>s.name.includes('오우섬 튀김')).photos[1],day:2},
      {title:'함께 걸으며 남기는 기억',caption:'류큐 역사 · 도자기 골목 · 초록 나무 터널',photo:d.days[5].stops.find(s=>s.name.includes('비세 후쿠기')).photos[0],day:5}
    ];
    const prepItems=d.days.flatMap((day,i)=>day.stops.filter(s=>s.activity && /권장|문의|확인|확정/.test(s.reservationLevel||'')).map(s=>({s,i})));
    const routePicker=`<div class="route-explorer"><object id="overview-route-map" class="route-map-object" data="maps/overview-interactive.svg" type="image/svg+xml" aria-label="날짜별로 경로를 강조할 수 있는 오키나와 전체 이동 지도"><img src="maps/overview.svg" alt="오키나와 전체 이동 경로"></object><div class="route-picker" aria-label="강조할 날짜 선택"><button class="route-pick" data-route="-1" aria-pressed="true" style="--route-color:#123c69"><b>전체 경로</b><span>7박 8일</span></button>${d.days.map((x,i)=>`<button class="route-pick" data-route="${i}" aria-pressed="false" style="--route-color:${colors[i]}"><b>${i+1}일차 · ${esc(x.date)}</b><span>${esc(x.area)}</span></button>`).join('')}</div></div><div class="route-selection" id="route-selection"><strong>전체 7박 8일 이동 경로</strong><span>오른쪽 날짜를 누르면 그날 경로만 굵게 보여요.</span><button class="map-link route-detail-link" id="route-detail-link" type="button" hidden>선택한 날짜 상세 일정 보기 →</button></div>`;
    document.querySelector('#days').insertAdjacentHTML('afterbegin',`<article class="day" id="main-panel" role="tabpanel" aria-labelledby="tab-main"><div class="welcome"><p class="welcome-kicker">12월, 우리 다섯의 오키나와</p><h2>바다 앞에서 쉬고,<br>동네의 맛을 나누는 여행.</h2><p>푸른 바다를 보고, 작은 시장에서 간식을 고르고,<br>오래된 골목을 함께 걸어요.<br>많이 사는 여행보다, 같이 맛보고 기억하는 7박 8일.</p><div class="concept-tags"><span>성인 5명</span><span>8인승 렌트 계획</span><span>숙소 아직 미정</span><span>이동마다 30분 여유</span></div><button class="map-link" data-day="0">우리 여행, 1일차부터 보기 →</button></div><div class="scene-grid">${tripScenes.map(s=>`<section class="scene-card">${photoCard(s.photo)}<div><h3>${esc(s.title)}</h3><p>${esc(s.caption)}</p><button class="text-button" data-day="${s.day}">${s.day+1}일차에서 만나기 →</button></div></section>`).join('')}</div><div class="intro-box"><h3>우리 가족은 이렇게 여행해요</h3><p>오전에는 주요 명소, 오후에는 산책과 먹거리. 식사와 쉬는 시간을 챙기고, 바람이 강하거나 피곤하면 가까운 곳에서 더 쉬어요.</p><p><strong>숙소는 아직 미정이에요</strong><br>지역별 숙박 계획: ${esc(d.stays)}</p><p>${esc(d.rentalNote||'')}</p></div><header class="day-head"><div class="date">한눈에 보는 전체 경로<small> · 날짜를 눌러 경로 강조</small></div></header>${routePicker}<p class="map-disclaimer">선택한 날짜의 길만 굵게 표시됩니다. 실제 도로를 따라가는 길 안내는 각 날짜의 구글 지도를 이용하세요.</p><section class="intro-box"><h3>예약 전에 확인할 것</h3><p>아래는 아직 예약 완료가 아니에요. 날짜별 카드에서 예매·문의 링크를 열어 주세요.</p>${prepItems.map(({s,i})=>`<button class="prep-button" data-day="${i}"><strong>${i+1}일차 · ${esc(s.name)}</strong><span>${esc(s.reservationLevel)}</span></button>`).join('')}<p>${esc(d.parkingNote||'')}</p></section><div class="map-actions"><button class="map-link" data-day="0">1일차 보기 →</button></div><div class="map-actions"><button class="map-link secondary-link" data-day="8">먹거리·기념품 미리 보기 →</button></div></article>`);
    const guideCard=(g,type,i)=>`<article class="guide-card">${g.photo?photoCard(g.photo):''}<div class="spot-body"><h3>${esc(g.name)}</h3><p class="jp-name">${esc(g.jp)}</p><p>${esc(g.description)}</p><p class="guide-budget">${esc(g.budget)}</p><p><strong>어디서?</strong> ${esc(g.where)}</p><p class="easy-tip">${esc(g.tip)}</p><button class="text-button" data-day="${g.day}">${g.day+1}일차 일정 보기 →</button><a class="info-link" href="${esc(g.source)}" target="_blank" rel="noopener noreferrer">공식·참고 안내 ↗</a><label class="guide-check"><input type="checkbox" data-guide="${type}-${i}"> ${type==='food'?'먹어봤어요':'구입했어요'}</label></div></article>`;
    document.querySelector('#day-nav').insertAdjacentHTML('beforeend','<button class="tab" id="tab-8" role="tab" aria-selected="false" aria-controls="day-8" data-day="8">먹거리·기념품<span>맛보고, 가져오기</span></button>');
    document.querySelector('#days').insertAdjacentHTML('beforeend',`<article class="day" id="day-8" role="tabpanel" aria-labelledby="tab-8" hidden><div class="welcome food-welcome"><p class="welcome-kicker">여행의 맛을, 집까지</p><h2>한 입씩 맛보고,<br>마음에 드는 것만 담아요.</h2><p>특산품과 꼭 먹어볼 음식, 가볍게 가져올 선물을 모았어요.</p></div><div class="intro-box"><p>${esc(d.souvenirNote||'')}</p><p>체크 표시는 지금 사용 중인 기기에 저장돼요.</p></div><h2 class="guide-heading">여행 중 꼭 맛볼 것</h2><div class="guide-grid">${(d.foodGuide||[]).map((g,i)=>guideCard(g,'food',i)).join('')}</div><h2 class="guide-heading">기념품·특산품</h2><div class="guide-grid">${(d.souvenirs||[]).map((g,i)=>guideCard(g,'gift',i)).join('')}</div><div class="map-actions"><button class="map-link" data-day="-1">여행 첫 화면으로 →</button></div></article>`);

    const selectDay=(i,scroll=true)=>{if(!Number.isInteger(i)||i < -1||i>d.days.length)i=-1;document.querySelectorAll('.tab').forEach(el=>{const active=Number(el.dataset.day)===i;el.setAttribute('aria-selected',active);el.tabIndex=active?0:-1;if(active&&scroll)el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})});document.querySelector('#main-panel').hidden=i!==-1;document.querySelectorAll('[role="tabpanel"]').forEach(el=>{if(el.id!=='main-panel')el.hidden=el.id!==`day-${i}`});history.replaceState(null,'',i===-1?'#main':i===8?'#food':`#day-${i+1}`);if(scroll)window.scrollTo({top:document.querySelector('.nav-shell').offsetTop,behavior:'smooth'})};
    let selectedRoute=-1;
    const paintRoute=i=>{
      selectedRoute=i;
      document.querySelectorAll('.route-pick').forEach(el=>el.setAttribute('aria-pressed',Number(el.dataset.route)===i));
      const obj=document.querySelector('#overview-route-map'),svg=obj?.contentDocument;
      if(svg)svg.querySelectorAll('.overview-route').forEach(el=>{const active=Number(el.dataset.route)===i;el.classList.toggle('is-selected',active);el.classList.toggle('is-muted',i!==-1&&!active)});
      const box=document.querySelector('#route-selection'),link=document.querySelector('#route-detail-link');
      if(i===-1){box.querySelector('strong').textContent='전체 7박 8일 이동 경로';box.querySelector('span').textContent='오른쪽 날짜를 누르면 그날 경로만 굵게 보여요.';link.hidden=true}
      else{const x=d.days[i];box.querySelector('strong').textContent=`${i+1}일차 · ${x.date} · ${x.area}`;box.querySelector('span').textContent=x.summary;link.hidden=false;link.dataset.day=i}
    };
    document.querySelector('#overview-route-map')?.addEventListener('load',()=>paintRoute(selectedRoute));
    document.querySelectorAll('.route-pick').forEach(el=>el.addEventListener('click',()=>paintRoute(Number(el.dataset.route))));
    document.querySelector('#route-detail-link')?.addEventListener('click',e=>selectDay(Number(e.currentTarget.dataset.day)));
    document.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('click',()=>selectDay(Number(el.dataset.day))));document.querySelectorAll('[data-move]').forEach(el=>el.addEventListener('click',()=>selectDay(Number(el.dataset.move))));
    document.querySelector('#day-nav').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const current=Number(document.activeElement.dataset.day);const next=e.key==='Home'?-1:e.key==='End'?8:Math.max(-1,Math.min(8,current+(e.key==='ArrowRight'?1:-1)));selectDay(next);document.querySelector(`#${next===-1?'tab-main':'tab-'+next}`).focus()});
    document.querySelector('#checklist').innerHTML=d.checklist.map((x,i)=>`<label><input type="checkbox" data-check="${i}"><span>${esc(x)}</span></label>`).join('');document.querySelector('#updated').textContent='일정 업데이트 · '+d.updatedAt;
    const key='okinawa-family-trip-checks',saved=JSON.parse(localStorage.getItem(key)||'{}');document.querySelectorAll('[data-check]').forEach(el=>{el.checked=!!saved[el.dataset.check];el.addEventListener('change',()=>{saved[el.dataset.check]=el.checked;localStorage.setItem(key,JSON.stringify(saved))})});
    const match=location.hash.match(/^#day-(\d+)$/);selectDay(location.hash==='#food'?8:match?Number(match[1])-1:-1,false);

    let guideSaved={};try{guideSaved=JSON.parse(localStorage.getItem('okinawa-guide-checks')||'{}')}catch{}
    document.querySelectorAll('[data-guide]').forEach(el=>{el.checked=!!guideSaved[el.dataset.guide];el.addEventListener('change',()=>{guideSaved[el.dataset.guide]=el.checked;try{localStorage.setItem('okinawa-guide-checks',JSON.stringify(guideSaved))}catch{}})});
  </script>
</body>
</html>
