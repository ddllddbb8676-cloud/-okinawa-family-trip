<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123c69">
  <meta name="description" content="2026년 우리 가족 오키나와 7박 8일 날짜별 일정과 지도">
  <title>우리 가족 오키나와 여행</title>
  <style>
    :root{--ink:#172033;--muted:#68758a;--line:#dbe4ee;--paper:#f4f8fb;--card:#fff;--blue:#123c69;--sea:#168aad;--sky:#e5f6fb;--coral:#ef8354;--green:#2d6a4f;--shadow:0 10px 30px rgba(25,54,86,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;line-height:1.55}button,a{font:inherit}.wrap{width:min(820px,100%);margin:auto}
    .hero{color:#fff;background:linear-gradient(145deg,#0d355f,#087e9d);padding:calc(28px + env(safe-area-inset-top)) 20px 30px}.eyebrow{font-size:13px;letter-spacing:.06em;opacity:.8}.hero h1{font-size:clamp(28px,8vw,44px);line-height:1.18;margin:9px 0 8px}.hero p{margin:0;opacity:.88}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:22px}.fact{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:11px 13px}.fact small{display:block;opacity:.72}.fact b{display:block;margin-top:2px}
    .section{padding:20px 16px 0}.overview,.day,.check{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}.overview{padding:18px}.flight{display:grid;gap:10px}.flight-row{display:flex;gap:11px;align-items:flex-start}.flight-row span{width:42px;color:var(--sea);font-weight:800}.flight-row strong{font-size:15px}.note{font-size:13px;color:var(--muted);margin-top:10px}.stay{margin-top:16px;padding:13px;border-radius:14px;background:var(--sky);color:var(--blue);font-weight:800}
    .nav-shell{position:sticky;top:0;z-index:10;background:rgba(244,248,251,.95);backdrop-filter:blur(12px);padding:11px 0 9px;border-bottom:1px solid var(--line)}.day-nav{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}.day-nav::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:15px;padding:8px 13px;min-width:69px;font-size:13px;font-weight:800;cursor:pointer}.tab span{display:block;font-size:11px;font-weight:600}.tab[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(18,60,105,.22)}
    .days{padding:16px}.day{overflow:hidden}.day[hidden]{display:none}.day-head{display:flex;justify-content:space-between;gap:14px;padding:18px;background:linear-gradient(90deg,#f2fafc,#fff)}.date{color:var(--blue);font-size:23px;font-weight:900}.date small{font-size:13px;font-weight:700;color:var(--muted)}.area{text-align:right}.area b{display:block}.area small{color:var(--muted)}.summary{margin:0;padding:0 18px 16px;color:var(--muted);font-size:14px}.badge{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:12px;font-weight:800}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
    .map-wrap{margin:0 14px 18px;border:1px solid #cfe4ec;border-radius:18px;overflow:hidden;background:#eaf7fa}.map-title{display:flex;justify-content:space-between;align-items:center;padding:12px 13px 8px}.map-title b{color:var(--blue)}.map-title small{color:var(--muted)}.route-map{display:block;width:100%;height:auto;aspect-ratio:2/1;background:linear-gradient(160deg,#dff4f8,#f8fcfd)}.route-line{fill:none;stroke:var(--sea);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 3px 2px rgba(22,138,173,.18))}.route-halo{fill:none;stroke:#fff;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}.map-dot{fill:var(--coral);stroke:#fff;stroke-width:5}.map-number{fill:#fff;font-size:22px;font-weight:900;text-anchor:middle;dominant-baseline:central}.north{fill:var(--blue);font-size:18px;font-weight:900}.coast{fill:#bfe3d4;opacity:.7}.route-key{display:flex;gap:7px;overflow-x:auto;padding:10px 12px 12px;background:#fff;scrollbar-width:none}.route-key::-webkit-scrollbar{display:none}.key-item{display:flex;align-items:center;gap:6px;flex:0 0 auto;background:#f3f7fa;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.key-num{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--coral);color:#fff;font-weight:900}.map-actions{display:flex;gap:8px;padding:0 12px 12px;background:#fff}.map-link{display:block;width:100%;text-align:center;text-decoration:none;background:var(--blue);color:#fff;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:800}
    .timeline-title{font-size:16px;margin:0;padding:0 18px 12px}.timeline{list-style:none;margin:0;padding:2px 18px 8px}.timeline li{position:relative;display:grid;grid-template-columns:54px 1fr;gap:12px;padding:0 0 18px 17px}.timeline li:before{content:"";position:absolute;left:2px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--sea);box-shadow:0 0 0 4px var(--sky)}.timeline li:not(:last-child):after{content:"";position:absolute;left:5px;top:21px;bottom:5px;width:2px;background:var(--line)}.time{color:var(--sea);font-size:13px;font-weight:900}.place b{display:block}.place small{color:var(--muted)}.caution{margin:0 18px 18px;padding:11px 13px;border-radius:12px;background:#fff4ed;color:#8d4529;font-size:13px}.day-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px 18px}.day-switch button{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--blue);padding:10px;font-size:13px;font-weight:800;cursor:pointer}.day-switch button:disabled{opacity:.35}
    .spot-card{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fbfdfe}.spot-photo{margin:0;position:relative;background:#e9f1f5}.spot-photo img{display:block;width:100%;height:170px;object-fit:cover}.spot-photo figcaption{position:absolute;right:7px;bottom:7px;background:rgba(0,0,0,.62);color:#fff;border-radius:7px;padding:3px 7px;font-size:10px}.spot-photo a{color:#fff}.spot-body{padding:11px}.spot-desc{margin:0 0 10px;font-size:13px;color:#354257}.spot-info{display:grid;grid-template-columns:72px 1fr;gap:5px 8px;margin:0;font-size:12px}.spot-info dt{color:var(--sea);font-weight:900}.spot-info dd{margin:0;color:#47566b}.meal .place>b:before{content:"🍽️ ";}.meal:before{background:var(--coral)!important;box-shadow:0 0 0 4px #fff0e9!important}
    .check{padding:18px;margin:0 16px 28px}.check h2{font-size:20px;margin:0 0 12px}.check label{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.check input{width:19px;height:19px;accent-color:var(--sea);flex:0 0 auto}.footer{padding:0 20px calc(30px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:12px}.updated{display:inline-block;padding:7px 11px;border-radius:999px;background:#eaf0f5}
    @media(min-width:680px){.facts{grid-template-columns:repeat(4,1fr)}.section{padding-left:16px;padding-right:16px}.route-map{aspect-ratio:2.3/1}.timeline li{grid-template-columns:62px 1fr}}
  .island-map{display:block;width:100%;max-height:560px}.overview-map{padding:0 12px}.locator{display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:8px 14px;background:white}.locator .island-map{height:230px}.locator p{font-size:13px;color:#934019}.zoom-caption{text-align:center;padding:8px;color:#934019;font-weight:800;background:#fff0e7}.detail-map{display:block;width:100%;height:300px}.map-disclaimer{font-size:11px;color:#68758a;padding:8px 14px;margin:0}.trip-legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}.trip-legend button{text-align:left;background:#f5f8fb;border:1px solid #dbe4ee;border-radius:8px;padding:10px;cursor:pointer;font-size:13px}.trip-legend span{display:block;color:#68758a}.route-key{flex-wrap:wrap;overflow:visible}.map-link{border:0;cursor:pointer}.place{min-width:0}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><div class="eyebrow" id="dates"></div><h1 id="title"></h1><p id="subtitle"></p><div class="facts" id="facts"></div></div></header>
  <main class="wrap">
    <section class="section"><div class="overview"><div class="flight" id="flight"></div><div class="stay" id="stay"></div><div class="note" id="flight-note"></div></div></section>
    <nav class="nav-shell" aria-label="날짜별 일정"><div class="day-nav" id="day-nav" role="tablist"></div></nav>
    <section class="days" id="days" aria-live="polite"></section>
    <section class="check"><h2>출발 전 확인</h2><div id="checklist"></div></section>
  </main>
  <footer class="footer"><span class="updated" id="updated"></span></footer>
  <script src="itinerary-data.js"></script>
  <script>
    const d=window.TRIP_DATA;
    const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const mapUrl=x=>{const p=x.map.map(v=>v.query||v.name);const origin=p.shift(),destination=p.pop();return `https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&waypoints=${encodeURIComponent(p.join('|'))}`};
    // Schematic coastline in longitude/latitude; routes connect stops, not roads.
    const coast=[[127.65,26.08],[127.70,26.07],[127.78,26.13],[127.82,26.18],[127.77,26.22],[127.82,26.30],[127.89,26.33],[127.86,26.39],[127.96,26.44],[127.95,26.51],[128.04,26.57],[128.13,26.59],[128.18,26.67],[128.27,26.73],[128.32,26.84],[128.29,26.88],[128.27,26.87],[128.21,26.78],[128.13,26.72],[128.07,26.65],[128.00,26.63],[128.00,26.69],[127.94,26.71],[127.88,26.71],[127.86,26.66],[127.89,26.62],[127.96,26.60],[127.96,26.54],[127.88,26.51],[127.82,26.46],[127.78,26.43],[127.73,26.44],[127.71,26.44],[127.72,26.39],[127.75,26.35],[127.74,26.30],[127.68,26.25],[127.65,26.20],[127.67,26.16],[127.65,26.08]];
    const xy=p=>[(p.lng-127.60)*600,(26.91-p.lat)*670];
    const coord=p=>xy(p).map(v=>v.toFixed(1)).join(',');
    const colors=['#7c3aed','#a16207','#c2410c','#0369a1','#be185d','#15803d','#6d28d9','#334155'];
    const line=x=>x.map(p=>coord(p)).join(' ');
    const land=()=>`<polygon points="${coast.map(([lng,lat])=>coord({lng,lat})).join(' ')}" fill="#dcebd8" stroke="#8da98b" stroke-width="1.5"/><ellipse cx="${xy({lng:128.021,lat:26.714})[0]}" cy="${xy({lng:128.021,lat:26.714})[1]}" rx="9" ry="7" fill="#dcebd8" stroke="#8da98b"/>`;
    const bounds=x=>{const pts=x.map(xy),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);let w=Math.max(75,Math.max(...xs)-Math.min(...xs)+42),h=Math.max(65,Math.max(...ys)-Math.min(...ys)+42);return [Math.min(...xs)-21,Math.min(...ys)-21,w,h]};
    const routes=(days,thin=false)=>days.map(x=>`<polyline points="${line(x.map)}" fill="none" stroke="${colors[d.days.indexOf(x)]}" stroke-width="${thin?2:3}" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
    const fullMap=(day=null)=>{let box=day?bounds(day.map):null;return `<svg class="island-map" viewBox="-50 0 540 600" role="img" aria-label="오키나와 본섬 전체 ${day?'확대 구역':'여행 경로'}"><rect x="-50" width="540" height="600" fill="#e8f5fa"/>${land()}${routes(day?[day]:d.days)}<text x="400" y="30" font-size="16" fill="#123c69">북쪽 ↑</text>${[['나하',127.679,26.214,-48,8],['나고',127.977,26.591,10,16],['고우리섬',128.02,26.714,10,-10],['모토부·비세',127.88,26.699,-92,-12],['온나·만좌모',127.85,26.50,-95,0],['차탄',127.758,26.316,-45,0],['남부',127.748,26.141,15,5],['북부 산림',128.21,26.79,-78,0]].map(([n,lng,lat,dx,dy])=>{const [x,y]=xy({lng,lat});return `<circle cx="${x}" cy="${y}" r="3" fill="#123c69"/><text x="${x+dx}" y="${y+dy}" font-size="15" font-weight="700" fill="#123c69" paint-order="stroke" stroke="#fff" stroke-width="3">${n}</text>`}).join('')}${box?`<rect x="${box[0]}" y="${box[1]}" width="${box[2]}" height="${box[3]}" rx="5" fill="#ef8354" fill-opacity=".12" stroke="#c2410c" stroke-width="3" stroke-dasharray="7 4"/>`:''}</svg>`};
    const mapSvg=x=>{const b=bounds(x.map),pad=Math.max(b[2],b[3])*.07;return `<div class="map-wrap"><div class="map-title"><b>전체 섬에서 오늘의 위치</b></div><div class="locator">${fullMap(x)}<p><b>${esc(x.area)}</b><br>주황색 테두리 안을<br>아래에서 확대해 봅니다.</p></div><div class="zoom-caption">↓ 표시한 구역 확대</div><svg class="detail-map" viewBox="${b[0]-pad} ${b[1]-pad} ${b[2]+pad*2} ${b[3]+pad*2}" role="img" aria-label="${esc(x.area)} 확대 이동도"><rect x="-1000" y="-1000" width="3000" height="3000" fill="#e8f5fa"/>${land()}${routes([x])}${x.map.map((p,i)=>{const [cx,cy]=xy(p),r=Math.max(b[2],b[3])/30;return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${colors[d.days.indexOf(x)]}" stroke="#fff" stroke-width="1"/><text x="${cx}" y="${cy+r*.35}" font-size="${r*1.3}" text-anchor="middle" fill="white" font-weight="bold">${x.map.findIndex(q=>q.lat===p.lat&&q.lng===p.lng)!==i?'1/'+(i+1):i+1}</text>`}).join('')}</svg><p class="map-disclaimer">위치 이해를 위한 약도 · 선은 방문 순서이며 실제 도로가 아닙니다.<br>숙소·렌터카 지점은 미정으로 대표 위치를 표시했습니다.</p><div class="route-key">${x.map.map((p,i)=>`<div class="key-item"><span class="key-num">${i+1}</span>${esc(p.name)}</div>`).join('')}</div><div class="map-actions"><a class="map-link" href="${mapUrl(x)}" target="_blank" rel="noopener">실제 경로 지도 열기</a></div></div>`};
    document.querySelector('#dates').textContent=d.dates;document.querySelector('#title').textContent=d.title;document.querySelector('#subtitle').textContent=d.subtitle;
    document.querySelector('#facts').innerHTML=[d.party,d.nights,...d.transport.map(x=>x.value)].map((v,i)=>`<div class="fact"><small>${['인원','기간','초반 이동','렌터카'][i]}</small><b>${esc(v)}</b></div>`).join('');
    document.querySelector('#flight').innerHTML=`<div class="flight-row"><span>가는편</span><strong>${esc(d.flight.outbound)}</strong></div><div class="flight-row"><span>오는편</span><strong>${esc(d.flight.inbound)}</strong></div>`;document.querySelector('#stay').textContent='숙박 · '+d.stays;document.querySelector('#flight-note').textContent=d.flight.note;
    document.querySelector('#day-nav').innerHTML='<button class="tab" id="tab-main" role="tab" aria-selected="true" aria-controls="main-panel" data-day="-1">메인<span>전체 경로</span></button>'+d.days.map((x,i)=>`<button class="tab" id="tab-${i}" role="tab" aria-selected="${i===0}" aria-controls="day-${i}" data-day="${i}">${i+1}일차<span>${esc(x.date)} · ${esc(x.dow)}</span></button>`).join('');
    const spotDetails=s=>s.activity?`<div class="spot-card">${s.photo?`<figure class="spot-photo"><img src="${s.photo.url}" alt="${esc(s.photo.alt)}" loading="lazy" onerror="this.closest('figure').hidden=true"><figcaption><a href="${s.photo.source}" target="_blank" rel="noopener">사진 출처</a></figcaption></figure>`:''}<div class="spot-body"><p class="spot-desc">${esc(s.activity)}</p><dl class="spot-info"><dt>예약</dt><dd>${esc(s.reservation||'불필요')}</dd><dt>입장료</dt><dd>${esc(s.ticket||'무료')}</dd><dt>주차</dt><dd>${esc(s.parking||'해당 없음')}</dd></dl></div></div>`:'';
    document.querySelector('#days').innerHTML=d.days.map((x,i)=>`<article class="day" id="day-${i}" role="tabpanel" aria-labelledby="tab-${i}" ${i?'hidden':''}><header class="day-head"><div class="date">${esc(x.date)} <small>${esc(x.dow)}요일</small></div><div class="area"><b>${esc(x.area)}</b><small>${esc(x.stay)}</small></div></header><p class="summary"><span class="badge"><span class="dot"></span>${esc(x.mode)}</span><br>${esc(x.summary)}</p>${mapSvg(x)}<h3 class="timeline-title">시간별 일정</h3><ol class="timeline">${x.stops.map(s=>`<li class="${s.kind==='meal'?'meal':''}"><div class="time">${esc(s.time)}</div><div class="place"><b>${esc(s.name)}</b><small>${esc(s.note)}</small>${spotDetails(s)}</div></li>`).join('')}</ol>${x.caution?`<p class="caution">${esc(x.caution)}</p>`:''}<div class="day-switch"><button data-move="${i-1}" ${i===0?'disabled':''}>← 전날</button><button data-move="${i+1}" ${i===d.days.length-1?'disabled':''}>다음 날 →</button></div></article>`).join('');
    document.querySelector('#days').insertAdjacentHTML('afterbegin',`<article class="day" id="main-panel" role="tabpanel" aria-labelledby="tab-main"><header class="day-head"><div class="date">전체 여행 경로<small> · 7박 8일</small></div></header><p class="summary">나하에서 시작해 남부, 서해안, 북부를 둘러보고 나하로 돌아옵니다.</p><div class="overview-map">${fullMap()}</div><p class="map-disclaimer">오키나와 본섬 약도 · 색상별 선은 날짜별 방문 순서입니다.<br>실제 도로와 해안선은 단순화했습니다.</p><div class="trip-legend">${d.days.map((x,i)=>`<button data-day="${i}" style="border-left:5px solid ${colors[i]}"><b>${i+1}일차 · ${esc(x.date)}</b><span>${esc(x.area)}</span></button>`).join('')}</div><p class="stay" style="margin:16px">${esc(d.stays)}</p><div class="map-actions"><button class="map-link" data-day="0">1일차 보기 →</button></div></article>`);
    const selectDay=(i,scroll=true)=>{if(!Number.isInteger(i)||i < -1||i>=d.days.length)i=-1;document.querySelectorAll('.tab').forEach(el=>{const active=Number(el.dataset.day)===i;el.setAttribute('aria-selected',active);el.tabIndex=active?0:-1;if(active&&scroll)el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})});document.querySelector('#main-panel').hidden=i!==-1;document.querySelectorAll('[role="tabpanel"]').forEach(el=>{if(el.id!=='main-panel')el.hidden=el.id!==`day-${i}`});history.replaceState(null,'',i===-1?'#main':`#day-${i+1}`);if(scroll)window.scrollTo({top:document.querySelector('.nav-shell').offsetTop,behavior:'smooth'})};
    document.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('click',()=>selectDay(Number(el.dataset.day))));document.querySelectorAll('[data-move]').forEach(el=>el.addEventListener('click',()=>selectDay(Number(el.dataset.move))));
    document.querySelector('#day-nav').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const current=Number(document.activeElement.dataset.day);const next=e.key==='Home'?-1:e.key==='End'?7:Math.max(-1,Math.min(7,current+(e.key==='ArrowRight'?1:-1)));selectDay(next);document.querySelector(`#${next===-1?'tab-main':'tab-'+next}`).focus()});
    document.querySelector('#checklist').innerHTML=d.checklist.map((x,i)=>`<label><input type="checkbox" data-check="${i}"><span>${esc(x)}</span></label>`).join('');document.querySelector('#updated').textContent='일정 업데이트 · '+d.updatedAt;
    const key='okinawa-family-trip-checks',saved=JSON.parse(localStorage.getItem(key)||'{}');document.querySelectorAll('[data-check]').forEach(el=>{el.checked=!!saved[el.dataset.check];el.addEventListener('change',()=>{saved[el.dataset.check]=el.checked;localStorage.setItem(key,JSON.stringify(saved))})});
    const match=location.hash.match(/^#day-(\d+)$/);selectDay(match?Number(match[1])-1:-1,false);
  </script>
</body>
</html>
